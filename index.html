<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Dashboard Vinted</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src https://*.vinted.net https://*.vinted.fr data:">
<style>
:root{--bg:#12151c;--card:#1b2029;--tx:#e8ebf2;--mut:#98a0b3;--ln:#2b3240;--ac:#3cc4c9}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
body{display:flex;flex-direction:column}
#bar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--ln)}
button{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--ln);border-radius:8px;padding:5px 14px;cursor:pointer}
button.on{background:var(--ac);color:#06262a;border-color:var(--ac);font-weight:600}
.sp{flex:1}#st{color:var(--mut);font-size:12px}
#views{flex:1;min-height:0;display:flex}
#dash{flex:1;overflow:auto;padding:16px;display:none}
#dash.show{display:block}
webview{flex:1;display:none}webview.show{display:flex}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px}
.k b{display:block;font-size:22px;margin-top:4px}.k span{color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--ln)}
th{color:var(--mut);font-weight:500;cursor:pointer;user-select:none}
td img{width:38px;height:38px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:8px}
.tag{font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--ln);color:var(--mut)}
h3{margin:18px 0 8px}
</style></head><body>
<div id="bar">
  <button data-t="dash" class="on">📊 Dashboard</button>
  <button data-t="vinted">🛍 Vinted</button>
  <span class="sp"></span><span id="st"></span>
  <button id="sync">⟳ Actualiser</button>
  <button id="folder">📁 Mes données</button>
</div>
<div id="views">
  <div id="dash"></div>
  <webview id="w" src="https://www.vinted.fr/" partition="persist:vinted"></webview>
</div>
<script src="app.js"></script>
</body></html>
